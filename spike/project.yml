# Throwaway Phase 0 spike. Regenerate the project with `cd spike && xcodegen generate`.
# Not held to the conventions in the root CLAUDE.md; see spike/README.md.
name: WordhoardSpike

options:
  bundleIdPrefix: dev.wordhoard
  xcodeVersion: "27.0"
  # iOS 27 like the product (ADR 0001 point 5): the regression runner links WordhoardCore, whose package
  # platform is iOS 27.
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Free personal team: leave empty, pick it in Xcode under Signing & Capabilities.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

# The product package. Only the regression runner links it (plan 2.2b): the spike app's own screens keep
# the Phase 0 code and are not maintained. Linking it into the host app as well would put a second copy
# of Core's SwiftData model classes into the process.
packages:
  WordhoardCore:
    path: ../WordhoardCore

targets:
  WordhoardSpike:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: WordhoardSpike
      # The WordNet bundle, stoplist and license live in the product package since plan task 2.2
      # (one copy in git); the spike copies them flat into its app bundle. See README "WordNet + model".
      - path: ../WordhoardCore/Sources/WordhoardCore/Resources/WordNet
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wordhoard.spike
        PRODUCT_NAME: WordhoardSpike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Wordhoard Spike
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  # Issue #14: on-device regression runner. A unit-test bundle hosted by the app; since plan 2.2b it
  # drives the product's FoundationModelsCardGenerator from WordhoardCore (its prompts, WordNet lookup
  # and AppleTranslator) in-process. Run it on a phone, never on the simulator (no language packs); see README.
  WordhoardSpikeRegression:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: WordhoardSpikeRegression
      # The word list is parsed from the repo's docs at run time; it is copied into the test
      # bundle so the list is never duplicated in code.
      - path: ../docs/regression-words.md
        buildPhase: resources
    dependencies:
      - target: WordhoardSpike
      - package: WordhoardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wordhoard.spike.regression
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  WordhoardSpike:
    build:
      targets:
        WordhoardSpike: all
    run:
      config: Debug
  WordhoardSpikeRegression:
    build:
      targets:
        WordhoardSpike: all
        WordhoardSpikeRegression: [test]
    test:
      config: Debug
      targets:
        - WordhoardSpikeRegression

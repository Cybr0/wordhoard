# Throwaway Phase 0 spike. Regenerate the project with `cd spike && xcodegen generate`.
# Not held to the conventions in the root CLAUDE.md; see spike/README.md.
name: WordhoardSpike

options:
  bundleIdPrefix: dev.wordhoard
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Free personal team: leave empty, pick it in Xcode under Signing & Capabilities.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  WordhoardSpike:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - WordhoardSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wordhoard.spike
        PRODUCT_NAME: WordhoardSpike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Wordhoard Spike
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

# Lint, regenerate-and-diff the committed project, run the Core tests, build the app and the UI-test
# bundle for a simulator. UI tests are compiled but not run here (slow and flaky on hosted runners);
# qa runs `xcodebuild test` locally.
name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "spike/**"
      - ".claude/**"
      - LICENSE
      - NOTICE
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "spike/**"
      - ".claude/**"
      - LICENSE
      - NOTICE

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GitHub-hosted preview image with Xcode 27.0 and iOS 27 simulators. macos-26 only has Xcode 26
    # and cannot build an iOS 27 deployment target.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      SWIFTFORMAT_VERSION: "0.63.1"
      # Non-empty: skip the preinstalled SwiftFormat and download the pinned release (tests that path).
      SWIFTFORMAT_FORCE_DOWNLOAD: ""
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app
          xcodebuild -version
          swift --version

      # SwiftFormat is pinned because new releases add rules that fail Lint (#65); bumping it means updating
      # `.swiftformat`'s header, the local tool and reformatting the code in one PR.
      - name: Install tools
        run: |
          brew install xcodegen swiftlint
          if [ -z "$SWIFTFORMAT_FORCE_DOWNLOAD" ] \
            && [ "$(swiftformat --version 2>/dev/null)" = "$SWIFTFORMAT_VERSION" ]; then
            echo "Using preinstalled SwiftFormat $SWIFTFORMAT_VERSION at $(command -v swiftformat)"
          else
            echo "Preinstalled SwiftFormat: $(swiftformat --version 2>/dev/null || echo none); downloading $SWIFTFORMAT_VERSION"
            SF_DIR="$RUNNER_TEMP/swiftformat-$SWIFTFORMAT_VERSION"
            mkdir -p "$SF_DIR"
            curl -fsSL -o "$SF_DIR/swiftformat.zip" \
              "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
            unzip -o -q "$SF_DIR/swiftformat.zip" -d "$SF_DIR"
            rm "$SF_DIR/swiftformat.zip"
            chmod +x "$SF_DIR/swiftformat"
            echo "$SF_DIR" >> "$GITHUB_PATH"
            export PATH="$SF_DIR:$PATH"
          fi
          ACTUAL="$(swiftformat --version 2>/dev/null || true)"
          if [ "$ACTUAL" != "$SWIFTFORMAT_VERSION" ]; then
            echo "::error::SwiftFormat must be $SWIFTFORMAT_VERSION (see .swiftformat header), got '${ACTUAL:-none}' at $(command -v swiftformat || echo 'no path')"
            exit 1
          fi
          xcodegen --version
          echo "swiftformat $(swiftformat --version) at $(command -v swiftformat)"
          swiftlint version

      - name: Lint
        run: |
          swiftformat --lint .
          swiftlint --strict

      - name: Regenerate project and diff
        run: |
          xcodegen generate
          git diff --exit-code -- Wordhoard.xcodeproj

      - name: Core tests
        run: swift test
        working-directory: WordhoardCore

      # First iPhone on an iOS 27 runtime only: an iOS 26 runtime on the image would be rejected by
      # xcodebuild because the deployment target is 27.0.
      - name: Pick simulator
        id: sim
        run: |
          SIM=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS-27")) | .value[]
                      | select(.name | startswith("iPhone"))][0].name')
          if [ -z "$SIM" ] || [ "$SIM" = "null" ]; then
            echo "No iPhone simulator on an iOS 27 runtime"; xcrun simctl list devices available; exit 1
          fi
          echo "Using simulator: $SIM"
          echo "name=$SIM" >> "$GITHUB_OUTPUT"

      # `build-for-testing` also compiles WordhoardUITests, which the plain `build` action skips because
      # the scheme does not build the test bundle for running. Nothing is executed.
      - name: Build for simulator
        run: |
          xcodebuild -scheme Wordhoard \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO build-for-testing

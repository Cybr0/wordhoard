# Generated with XcodeGen 2.46.0. Edit this file, then run `xcodegen generate`; never hand-edit
# Wordhoard.xcodeproj. CI regenerates and fails on any diff.
name: Wordhoard

options:
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Signing is picked per machine in Xcode (Signing & Capabilities). Never commit a team id.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  WordhoardCore:
    path: WordhoardCore

targets:
  Wordhoard:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Wordhoard
      # The app's own Apache 2.0 text, shown in full on the About screen (S6, plan 6.3).
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - package: WordhoardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wordhoard.app
        PRODUCT_NAME: Wordhoard
        # 1.0.0 for the whole v1 TestFlight period; the build number is +1 per upload, in its own commit.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # iPhone only (requirements §2). iPad runs it in compatibility mode.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wordhoard
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        # Every build re-extracts the keys into the one String Catalog (plan 6.3).
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Portrait only; 6.1 checked Dynamic Type up to AX5 and landscape was not needed.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Wordhoard uses the camera to take a picture for a word card."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  WordhoardUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: WordhoardUITests
        excludes:
          # Nested SwiftLint config for the test directory, not a bundle resource.
          - .swiftlint.yml
    dependencies:
      - target: Wordhoard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wordhoard.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Wordhoard:
    build:
      targets:
        Wordhoard: all
        WordhoardUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: WordhoardCore/WordhoardCoreTests
        - WordhoardUITests
